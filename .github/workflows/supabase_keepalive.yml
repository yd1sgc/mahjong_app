name: Supabase Keepalive

on:
  schedule:
    - cron: '0 15 * * *' # 毎日JST午前0時 (UTC 15:00) に自動実行
  workflow_dispatch: # 手動実行トリガー

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          if [ -z "${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" ] || [ -z "${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" ]; then
            echo "Secrets not configured yet. Skipping ping."
            exit 0
          fi
          curl -f -s \
            -H "apikey: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" \
            "${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}/rest/v1/rule_templates?select=rule_id&limit=1" > /dev/null
          echo "Supabase keepalive ping successful."
